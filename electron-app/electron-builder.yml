appId: com.hdeg.app
productName: "HdeG"
copyright: "Copyright © 2024"

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../dist/main.exe
    to: python-backend/main.exe
  - from: icon.png
    to: icon.png
  - from: config-template.json
    to: config-template.json

win:
  target:
    - nsis
  icon: icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  language: "2052"
  installerLanguages:
    - zh_CN
  shortcutName: "转译"
  uninstallDisplayName: "转译 - 日语字幕翻译工具"
  createDesktopShortcut: true
  createStartMenuShortcut: true
